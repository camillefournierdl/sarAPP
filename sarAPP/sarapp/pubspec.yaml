name: sarapp
description: "Mood and cycle tracker"
publish_to: 'none'
version: 0.2.0+4

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local database (SQLite)
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0

  # State management
  provider: ^6.1.2

  # Charts
  fl_chart: ^0.69.0

  # Calendar
  table_calendar: ^3.1.2

  # CSV export & file sharing
  csv: ^6.0.0
  path_provider: ^2.1.4
  share_plus: ^9.0.0

  # JSON backup import (file picker for restore)
  # Pinned below 8.1.0: newer file_picker needs web ^1.0.0, which conflicts
  # with share_plus 9.0.0's web ^0.5.0 requirement.
  file_picker: ^8.0.7

  # Date formatting
  intl: 0.20.2

  # Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  flutter_timezone: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/
